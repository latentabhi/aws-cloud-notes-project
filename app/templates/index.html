<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Notes Application</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f7f7f8;
            color: #222;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 24px;
        }

        header {
            border-bottom: 2px solid #232f3e;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 20px;
            color: #16191f;
        }

        header p {
            margin: 0;
            font-size: 13px;
            color: #666;
        }

        .row {
            display: flex;
            gap: 24px;
        }

        .col-form {
            flex: 1;
            min-width: 280px;
            border-right: 1px solid #eee;
            padding-right: 24px;
        }

        .col-list {
            flex: 1.5;
        }

        h2 {
            font-size: 15px;
            margin: 0 0 12px 0;
            color: #232f3e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        input[type="text"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #aab7b8;
            border-radius: 3px;
            padding: 7px 9px;
            font-size: 13px;
            color: #111;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #0073bb;
            outline: none;
        }

        input[type="file"] {
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }

        .help-text {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        button.btn-submit {
            background-color: #ec7211;
            color: #fff;
            border: 1px solid #dd6b10;
            border-radius: 3px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button.btn-submit:hover {
            background-color: #eb5f07;
        }

        button.btn-submit:disabled {
            background-color: #ccc;
            border-color: #bbb;
            cursor: not-allowed;
        }

        button.btn-cancel {
            background: none;
            border: 1px solid #d5dbdb;
            color: #555;
            border-radius: 3px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
        }

        button.btn-cancel:hover {
            background-color: #f0f0f0;
        }

        .notes-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .notes-table th {
            text-align: left;
            background-color: #fafafa;
            border-bottom: 1px solid #d5dbdb;
            padding: 8px;
            font-size: 12px;
            color: #444;
        }

        .notes-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #eaeded;
            vertical-align: top;
        }

        .note-title {
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
        }

        .note-body {
            color: #444;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-meta {
            font-size: 11px;
            color: #777;
            line-height: 1.4;
        }

        .btn-edit {
            background: none;
            border: 1px solid #d5dbdb;
            color: #0073bb;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-edit:hover {
            background-color: #f0f8ff;
            border-color: #0073bb;
        }

        .btn-delete {
            background: none;
            border: 1px solid #d5dbdb;
            color: #b71c1c;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 2px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #fbe9e7;
            border-color: #d32f2f;
        }

        .status-msg {
            font-size: 12px;
            color: #666;
            padding: 8px 0;
        }

        .attachment-link {
            font-size: 12px;
            color: #0073bb;
            text-decoration: none;
            display: inline-block;
            margin-top: 4px;
        }

        .attachment-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .row {
                flex-direction: column;
            }

            .col-form {
                border-right: none;
                border-bottom: 1px solid #eee;
                padding-right: 0;
                padding-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cloud Notes Management System</h1>
            <p>AWS Practical Project: EC2, S3 Storage, and Database Integration</p>
        </header>

        <div class="row">
            <div class="col-form">
                <h2 id="formHeading">Add Note</h2>
                <form id="noteForm">
                    <input type="hidden" id="editIdInput" value="">

                    <div class="form-group">
                        <label for="titleInput">Title</label>
                        <input type="text" id="titleInput" name="title" required placeholder="Enter title">
                    </div>

                    <div class="form-group">
                        <label for="bodyInput">Details</label>
                        <textarea id="bodyInput" name="body" rows="4" placeholder="Enter notes or description"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="fileInput">Attachment</label>
                        <input type="file" id="fileInput" name="file">
                        <div class="help-text">Submit any Document if needed.</div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">Submit Note</button>
                    <button type="button" id="cancelBtn" class="btn-cancel" style="display: none;" onclick="cancelEdit()">Cancel</button>
                </form>
            </div>

            <div class="col-list">
                <h2>Saved Notes</h2>
                <div id="tableWrapper">
                    <div id="statusMsg" class="status-msg">reading notes...</div>
                    <table class="notes-table" id="notesTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>Content</th>
                                <th style="width: 140px;">Metadata</th>
                                <th style="width: 110px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="notesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        var allNotes = [];

        function escapeHtml(str) {
            if (!str) return "";
            var div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function loadNotes() {
            var statusMsg = document.getElementById("statusMsg");
            var table = document.getElementById("notesTable");
            var tbody = document.getElementById("notesTableBody");

            fetch("/notes")
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    allNotes = data || [];

                    if (!allNotes || allNotes.length === 0) {
                        statusMsg.innerText = "No records found.";
                        statusMsg.style.display = "block";
                        table.style.display = "none";
                        return;
                    }

                    statusMsg.style.display = "none";
                    tbody.innerHTML = allNotes.map(function (item) {
                        var bodyHtml = item.body ? '<div class="note-body">' + escapeHtml(item.body) + '</div>' : '';
                        var fileHtml = item.file_url ? '<a class="attachment-link" href="' + item.file_url + '" target="_blank">Download Attachment</a>' : '';

                        return '<tr>' +
                            '<td><div class="note-title">' + escapeHtml(item.title) + '</div>' + bodyHtml + fileHtml + '</td>' +
                            '<td class="note-meta"><div>Date: ' + escapeHtml(item.added_on) + '</div><div>ID: ' + escapeHtml(item.id) + '</div></td>' +
                            '<td>' +
                                '<button class="btn-edit" onclick="editNote(\'' + item.id + '\')">Edit</button>' +
                                '<button class="btn-delete" onclick="deleteNote(\'' + item.id + '\')">Delete</button>' +
                            '</td>' +
                            '</tr>';
                    }).join('');

                    table.style.display = "table";
                })
                .catch(function () {
                    statusMsg.innerText = "Error loading records from server.";
                    statusMsg.style.display = "block";
                });
        }

        function editNote(id) {
            var note = allNotes.find(function (n) { return n.id === id; });
            if (!note) return;

            document.getElementById("editIdInput").value = note.id;
            document.getElementById("titleInput").value = note.title;
            document.getElementById("bodyInput").value = note.body || "";
            document.getElementById("formHeading").innerText = "Edit Note";
            document.getElementById("submitBtn").innerText = "Update Note";
            document.getElementById("cancelBtn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function cancelEdit() {
            document.getElementById("noteForm").reset();
            document.getElementById("editIdInput").value = "";
            document.getElementById("formHeading").innerText = "Add Note";
            document.getElementById("submitBtn").innerText = "Submit Note";
            document.getElementById("cancelBtn").style.display = "none";
        }

        document.getElementById("noteForm").onsubmit = function (e) {
            e.preventDefault();
            var submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Saving...";

            var editId = document.getElementById("editIdInput").value;
            var url = editId ? "/notes/" + encodeURIComponent(editId) : "/notes";
            var formData = new FormData(this);

            fetch(url, {
                method: "POST",
                body: formData
            })
            .then(function (res) { return res.json(); })
            .then(function () {
                cancelEdit();
                submitBtn.disabled = false;
                loadNotes();
            })
            .catch(function () {
                alert("Failed to save note.");
                submitBtn.disabled = false;
                submitBtn.textContent = editId ? "Update Note" : "Submit Note";
            });
        };

        function deleteNote(noteId) {
            if (!confirm("Are you sure you want to delete this note?")) {
                return;
            }

            if (document.getElementById("editIdInput").value === noteId) {
                cancelEdit();
            }

            fetch("/notes/" + encodeURIComponent(noteId), {
                method: "DELETE"
            })
            .then(function (res) { return res.json(); })
            .then(function () {
                loadNotes();
            })
            .catch(function () {
                alert("Error deleting note.");
            });
        }

        loadNotes();
    </script>
</body>
</html>
